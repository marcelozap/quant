[project]
name = "quant-live"
version = "0.1.0"
description = "Small CLI for Schwab market data and account snapshots."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
green-machine-secure-store = [
    "sqlcipher3>=0.5.4",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
quant-live = "quant_live.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
